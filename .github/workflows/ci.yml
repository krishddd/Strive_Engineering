name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily triage tick (UTC). Odd minute to avoid the top-of-hour thundering herd.
    - cron: "23 5 * * *"

jobs:
  rust:
    name: loopguard (Rust)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      - name: build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: loopguard-linux
          path: target/release/loopguard

  python:
    name: loopengine (Python)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: build loopguard (needed by integration tests)
        run: cargo build --release
      - name: install loopengine
        run: pip install -e "loopengine[dev]"
      - name: pytest
        run: pytest loopengine/tests -q

  # The L1 loop, closed: scheduled trigger -> restore durable state (cursors) ->
  # run the triage -> publish actionable findings to a rolling issue -> persist
  # state back to the loop-state branch. Report-only: it never touches main.
  daily-triage:
    name: daily-triage (scheduled, report-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Both scheduled and manual (workflow_dispatch) triage runs are independent of
    # the test jobs — this is report-only and never touches main, so it doesn't
    # gate on rust/python. (The rust+python jobs run on push/PR to protect main.)
    needs: []
    permissions:
      contents: write   # push .loop-state to the loop-state branch
      issues: write     # maintain the rolling report issue
    concurrency:
      group: daily-triage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # triage reads commit history; cursors need real SHAs
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: daily-triage
      - run: cargo build --release
      - run: pip install -e loopengine

      - name: restore loop state (cursors) from the loop-state branch
        run: |
          if git fetch origin loop-state 2>/dev/null; then
            git checkout origin/loop-state -- .loop-state || true
            echo "state restored from loop-state branch"
          else
            echo "no loop-state branch yet — first run"
          fi

      - name: run the triage loop (report-only)
        run: loopengine run loops/ci-self.json

      - name: publish findings / resolve the rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          title="Loop report: ci-self-triage"
          gh label create loop-report --description "rolling loop reports" --force || true
          num=$(gh issue list --label loop-report --state open \
                  --search "\"$title\" in:title" --json number --jq '.[0].number // empty')

          if body=$(loopengine report .loop-state/state.json ci-self-triage); then
            # Actionable run: publish/refresh the findings.
            if [ -n "$num" ]; then
              gh issue edit "$num" --body "$body"
              echo "updated issue #$num with findings"
            else
              gh issue create --title "$title" --label loop-report --body "$body"
            fi
          else
            # Clean run: don't leave stale findings live. If an issue is open, edit
            # it to the resolved banner; once the clean streak is long enough the
            # banner carries a close marker and we close the issue outright.
            if [ -n "$num" ]; then
              banner=$(loopengine report .loop-state/state.json ci-self-triage --resolved --close-after 7)
              gh issue edit "$num" --body "$banner"
              if printf '%s' "$banner" | grep -q 'loop-report:close'; then
                gh issue close "$num" --comment "Clean streak reached — closing; a future finding reopens a fresh report."
                echo "closed issue #$num (clean streak)"
              else
                echo "edited issue #$num to the resolved banner"
              fi
            else
              echo "clean run, no open issue — nothing to publish (triage-inbox discipline)"
            fi
          fi

      - name: persist loop state to the loop-state branch
        run: |
          set -eu
          git config user.name "loopengine[bot]"
          git config user.email "loopengine-bot@users.noreply.github.com"
          if git rev-parse -q --verify origin/loop-state >/dev/null; then
            git worktree add ../state-wt -B loop-state origin/loop-state
          else
            git worktree add --detach ../state-wt
            git -C ../state-wt checkout --orphan loop-state
            git -C ../state-wt rm -r -f -q . 2>/dev/null || true
          fi
          rm -rf ../state-wt/.loop-state
          mkdir -p ../state-wt
          cp -r .loop-state ../state-wt/
          git -C ../state-wt add -A
          git -C ../state-wt commit -m "loop-state: run ${{ github.run_id }}" \
            || { echo "no state change"; exit 0; }
          git -C ../state-wt push origin loop-state

      - uses: actions/upload-artifact@v4
        with:
          name: triage-state
          path: .loop-state/
